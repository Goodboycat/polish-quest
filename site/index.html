<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B0D12">
<meta name="description" content="Drop your game's zip. Get 26 copy-paste prompts for your AI coding tool, in the right order. Your zip never leaves your device.">
<title>Polish Quest: finish your game, one prompt at a time</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/screens.css">
<link rel="stylesheet" href="css/guide.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<header class="bar">
  <a class="brand" href="#home">Polish Quest</a>
  <nav aria-label="Main">
    <a href="#overview">All steps</a>
    <a href="#fix">Fix Kit</a>
    <a href="#privacy">Privacy</a>
  </nav>
</header>
<div class="progress"><i id="progress-fill"></i></div>
<main id="screen" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept=".zip" class="hidden">
<noscript><p class="noscript">Polish Quest needs JavaScript to read your zip inside your browser.</p></noscript>
<script defer src="js/config.js"></script>
<script defer src="js/data.js"></script>
<script defer src="js/core.js"></script>
<script defer src="js/prompts-1.js"></script>
<script defer src="js/prompts-2.js"></script>
<script defer src="js/prompts-3.js"></script>
<script defer src="js/prompts-4.js"></script>
<script defer src="js/prompts-fix.js"></script>
<script defer src="js/zip.js"></script>
<script defer src="js/detect.js"></script>
<script defer src="js/store.js"></script>
<script defer src="js/scene.bundle.js"></script>
<script defer src="js/app.js"></script>
<script defer src="js/screens-steps.js"></script>
<script defer src="js/offer.js"></script>
<script defer src="js/screens-more.js"></script>
<script defer src="js/guide.js"></script>
<script defer src="js/mascot.js"></script>
</body>
</html>
